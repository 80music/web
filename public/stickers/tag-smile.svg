<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <filter id="tagShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Ticket body with scalloped notches -->
  <g filter="url(#tagShadow)">
    <path d="M 12,8 L 148,8 A 6,6 0 0,1 154,14 L 154,34 A 7,7 0 0,0 154,46 L 154,66 A 6,6 0 0,1 148,72 L 12,72 A 6,6 0 0,1 6,66 L 6,46 A 7,7 0 0,0 6,34 L 6,14 A 6,6 0 0,1 12,8 Z" fill="#ffffff" stroke="#1674d6" stroke-width="2.5" />
    <!-- Dashed fold line -->
    <line x1="42" y1="8" x2="42" y2="72" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="24" cy="40" r="5" fill="#1674d6" />
    <!-- Text -->
    <text x="96" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#14365f" text-anchor="middle" letter-spacing="0.5">ACOUSTIC</text>
    <text x="96" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#2391ff" text-anchor="middle" letter-spacing="1.5">CHORDISOL</text>
  </g>
</svg>
