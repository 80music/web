<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g2)"/>
  <circle cx="120" cy="180" r="130" fill="url(#sunGlow)"/>
  <!-- Pianist Hands & Keys Motif -->
  <g transform="translate(60, 45)">
    <!-- Keyboard perspective -->
    <path d="M20,160 L260,160 L240,210 L0,210 Z" fill="#f8fafc" opacity="0.95"/>
    <!-- Black keys -->
    <rect x="30" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <rect x="52" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <rect x="88" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <rect x="110" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <rect x="132" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <rect x="168" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <rect x="190" y="160" width="12" height="30" rx="2" fill="#0f172a"/>
    <!-- Person sitting at piano -->
    <circle cx="140" cy="55" r="30" fill="#1e1b4b" opacity="0.85"/>
    <path d="M100,135 C100,95 120,85 140,85 C160,85 180,95 180,135 Z" fill="#1e1b4b" opacity="0.85"/>
    <!-- Music sparkles -->
    <polygon points="210,40 214,48 222,50 216,56 218,64 210,58 202,64 204,56 198,50 206,48" fill="#fef08a"/>
    <polygon points="80,70 82,75 88,76 84,80 85,85 80,82 75,85 76,80 72,76 78,75" fill="#f472b6"/>
  </g>
  <!-- Frame Badge -->
  <rect x="16" y="16" width="60" height="20" rx="10" fill="#000000" fill-opacity="0.35"/>
  <text x="46" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TAKE 02</text>
</svg>
