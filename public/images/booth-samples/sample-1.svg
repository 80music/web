<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="warmSpot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g1)"/>
  <circle cx="280" cy="90" r="140" fill="url(#warmSpot)"/>
  <!-- Guitar Silhouette & Headphone Motif -->
  <g transform="translate(140, 40)">
    <!-- Person silhouette smiling with acoustic guitar -->
    <circle cx="60" cy="50" r="32" fill="#0c4a6e" opacity="0.85"/>
    <path d="M20,130 C20,95 40,82 60,82 C80,82 100,95 100,130 Z" fill="#0c4a6e" opacity="0.85"/>
    <!-- Headphones -->
    <path d="M30,50 C30,30 90,30 90,50" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <rect x="24" y="44" width="12" height="18" rx="6" fill="#f8fafc"/>
    <rect x="84" y="44" width="12" height="18" rx="6" fill="#f8fafc"/>
    <!-- Guitar Body Outline -->
    <path d="M70,120 C100,105 130,125 125,155 C120,185 75,195 55,175 C45,160 55,130 70,120 Z" fill="#f59e0b" opacity="0.9"/>
    <circle cx="85" cy="150" r="12" fill="#78350f"/>
    <!-- Music notes -->
    <path d="M120,50 L120,35 L140,30 L140,45 M120,40 L140,35" stroke="#fef08a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="116" cy="50" r="5" fill="#fef08a"/>
    <circle cx="136" cy="45" r="5" fill="#fef08a"/>
  </g>
  <!-- Frame Badge -->
  <rect x="16" y="16" width="60" height="20" rx="10" fill="#000000" fill-opacity="0.35"/>
  <text x="46" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TAKE 01</text>
</svg>
