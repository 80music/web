<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="coralGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g3)"/>
  <circle cx="200" cy="120" r="120" fill="url(#coralGlow)"/>
  <!-- Vocal Studio Smile & Retro Microphone Motif -->
  <g transform="translate(100, 35)">
    <!-- Person silhouette laughing / peace sign pose -->
    <circle cx="90" cy="60" r="32" fill="#4c0519" opacity="0.85"/>
    <path d="M50,140 C50,105 70,95 90,95 C110,95 130,105 130,140 Z" fill="#4c0519" opacity="0.85"/>
    <!-- Peace sign hand gesture -->
    <path d="M140,80 L144,55 M144,55 L150,58 M150,58 L152,78 M140,80 L152,78" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="146" cy="56" r="3" fill="#fbcfe8"/>
    <!-- Vintage Ribbon Mic -->
    <rect x="135" y="100" width="22" height="34" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <line x1="146" y1="134" x2="146" y2="175" stroke="#f8fafc" stroke-width="4"/>
    <line x1="135" y1="112" x2="157" y2="112" stroke="#475569" stroke-width="2"/>
    <line x1="135" y1="122" x2="157" y2="122" stroke="#475569" stroke-width="2"/>
    <!-- Starbursts -->
    <polygon points="40,40 44,48 52,50 46,56 48,64 40,58 32,64 34,56 28,50 36,48" fill="#fef08a"/>
    <polygon points="170,45 172,50 178,51 174,55 175,60 170,57 165,60 166,55 162,51 168,50" fill="#fef08a"/>
  </g>
  <!-- Frame Badge -->
  <rect x="16" y="16" width="60" height="20" rx="10" fill="#000000" fill-opacity="0.35"/>
  <text x="46" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TAKE 03</text>
</svg>
